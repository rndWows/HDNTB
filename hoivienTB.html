<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Hội Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Cập nhật thư viện html2canvas lên phiên bản mới hơn -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 100%;
            margin: auto;
        }

        .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .pagination {
            margin-top: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .excel-btn {
            margin-bottom: 15px;
        }

        /* Card styles */
        .carousel-control-prev,
        .carousel-control-next {
            background-color: rgba(0, 0, 0, 0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        .invitation-card {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            height: 0;
            padding-bottom: 141%;
            /* Maintain aspect ratio */
            position: relative;
            overflow: hidden;
        }

        .invitation-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .invitation-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .member-info {
            position: absolute;
            top: 59%;
            width: 100%;
            text-align: center;
            font-family: 'Noto Sans', sans-serif;
        }

        @media (max-width: 768px) {
            .invitation-card {
                padding-bottom: 141%;
            }
        }

        /* Thêm hiệu ứng loading */
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            vertical-align: text-bottom;
            border: 0.2em solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spinner-border .75s linear infinite;
        }

        @keyframes spinner-border {
            to {
                transform: rotate(360deg);
            }
        }

        #downloadProgress {
            display: none;
            margin-top: 10px;
        }

        /* Tăng kích thước checkbox */
        input[type="checkbox"].member-select {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        /* Tăng kích thước cho checkbox "Chọn tất cả" */
        #selectAll {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        /* Tạo khoảng cách tốt hơn cho ô chứa checkbox */
        td:has(input[type="checkbox"]),
        th:has(input[type="checkbox"]) {
            text-align: center;
            vertical-align: middle;
            width: 40px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm...">
                    <button class="btn btn-primary" onclick="applyFilter()">Tìm kiếm</button>
                </div>
            </div>
            <div class="col-md-4">
                <button class="btn btn-primary" id="selectModeBtn">Chọn hội viên</button>
                <button class="btn btn-warning ms-2" id="generateCardsBtn" style="display:none;">
                    Tạo thư mời (<span id="selectedCount">0</span>)
                </button>
                <button class="btn btn-danger ms-2" id="cancelSelectBtn" style="display:none;">Hủy chọn</button>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success excel-btn" onclick="exportToExcel()">
                    <i class="bi bi-download"></i> Xuất Excel
                </button>
            </div>
        </div>

        <div id="loading" class="text-center my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-2">Đang tải dữ liệu...</p>
        </div>

        <div id="error" class="alert alert-danger my-4" style="display: none;"></div>

        <div id="tableContainer" style="display: none;">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Hình</th>
                            <th>Tên hội viên</th>
                            <th>Ngày sinh nhật</th>
                            <th>Chức vụ</th>
                            <th>Công ty</th>
                            <th>Chức vụ (Cty)</th>
                            <th>Ngày tham gia hội</th>
                            <th>Điện thoại hội viên</th>
                            <th>Email</th>
                            <th>Chi hội</th>
                        </tr>
                    </thead>
                    <tbody id="memberList"></tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    Hiển thị <span id="startCount">0</span> đến <span id="endCount">0</span> của <span
                        id="totalCount">0</span> hội viên
                    <select id="itemsPerPageSelector" class="form-select d-inline-block ms-2" style="width: auto;">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="all">Tất cả</option>
                    </select> hội viên mỗi trang
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Invitation Modal -->
    <div class="modal fade" id="invitationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thư mời đại hội</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="carouselInvitations" class="carousel slide" data-bs-ride="carousel">
                        <div class="carousel-inner" id="invitationCarousel"></div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#carouselInvitations"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carouselInvitations"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>

                    <!-- Thêm thanh tiến trình -->
                    <div id="downloadProgress" class="progress mt-3" style="display: none;">
                        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                            style="width: 0%"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="downloadCurrentBtn">
                        <span id="downloadCurrentText">Tải ảnh hiện tại</span>
                        <span id="downloadCurrentSpinner" class="loading-spinner d-none"></span>
                    </button>
                    <button type="button" class="btn btn-success" id="downloadAllBtn">
                        <span id="downloadAllText">Tải tất cả ảnh</span>
                        <span id="downloadAllSpinner" class="loading-spinner d-none"></span>
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Constants for AppSheet connection
        const appId = '4dc0f883-9c1c-4d4a-81aa-4bd7971b78dd';
        const accessKey = 'V2-W3bVS-xCeBf-DSk9A-U3pVV-B5C41-0gBhu-Z1bQL-j6kNl';
        const region = 'www';
        const backgroundUrl = 'https://rndwows.github.io/HDNTB/nenTB.jpg';

        // Store all members and pagination state
        let allMembers = [];
        let filteredMembers = [];
        let currentPage = 1;
        let itemsPerPage = 10;

        // Selection mode variables
        let isSelectionMode = false;
        let selectedMembers = [];
        let invitationModal;
        let backgroundImage = null;

        // Initialize modals after document load
        $(document).ready(function () {
            invitationModal = new bootstrap.Modal(document.getElementById('invitationModal'));

            // Preload background image
            backgroundImage = new Image();
            backgroundImage.crossOrigin = "anonymous"; // Thêm hỗ trợ CORS
            backgroundImage.onload = function () {
                console.log("Background image loaded successfully");
            };
            backgroundImage.onerror = function () {
                console.error("Failed to load background image");
                alert("Không thể tải ảnh nền. Vui lòng kiểm tra kết nối mạng và thử lại.");
            };
            backgroundImage.src = backgroundUrl;
        });

        // Function to format date (DD/MM/YYYY)
        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                if (isNaN(date)) return '';
                return date.toLocaleDateString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (e) {
                return '';
            }
        }

        // Function to fetch data from AppSheet
        async function fetchMembers() {
            try {
                $('#loading').show();
                $('#tableContainer').hide();
                $('#error').hide();

                const response = await $.ajax({
                    url: `https://${region}.appsheet.com/api/v2/apps/${appId}/tables/HV_NCC_KH/Action`,
                    method: 'POST',
                    headers: {
                        'ApplicationAccessKey': accessKey,
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({
                        Action: 'Find',
                        Properties: {},
                        Selector: "HV_NCC_KH"  // Lấy tất cả dữ liệu
                    })
                });

                if (!Array.isArray(response)) {
                    throw new Error('Invalid data format received');
                }

                // Filter ở client
                allMembers = response.filter(member => {
                    // Kiểm tra nhiều khả năng của giá trị Active
                    return member.Active === 'active' ||
                        member.Active === true ||
                        member.Active === 'true' ||
                        member.Active === 'Active';
                });

                filteredMembers = [...allMembers];

                renderTable();
                renderPagination();

                $('#loading').hide();
                $('#tableContainer').show();
            } catch (error) {
                console.error('Failed to fetch members:', error);
                $('#loading').hide();
                $('#error').show().text(`Lỗi khi tải dữ liệu: ${error.message}`);
            }
        }

        // Function to render table with current page data
        function renderTable() {
            const tableBody = $('#memberList');
            tableBody.empty();

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredMembers.length);

            const membersToShow = filteredMembers.slice(startIndex, endIndex);

            if (membersToShow.length === 0) {
                tableBody.html(`
                    <tr>
                        <td colspan="10" class="text-center py-5">
                            Không tìm thấy hội viên nào phù hợp với tìm kiếm của bạn
                        </td>
                    </tr>
                `);
            } else {
                membersToShow.forEach((member, index) => {
                    // Simplified image handling - just show a placeholder if no image
                    let imageCell = `<div class="bg-light text-center rounded" style="width: 60px; height: 60px; line-height: 60px;">N/A</div>`;

                    if (member['Hình hội viên']) {
                        const baseUrl = 'https://www.appsheet.com/template/gettablefileurl';
                        const params = new URLSearchParams({
                            appName: 'HDNTháiBìnhMiềnNam-925719472',
                            tableName: 'HV_NCC_KH',
                            fileName: member['Hình hội viên'].trim()
                        });
                        const imageUrl = `${baseUrl}?${params.toString()}`;
                        imageCell = `<img src="${imageUrl}" class="member-avatar" alt="${member['Tên hội viên'] || 'Hội viên'}" onerror="this.src='https://via.placeholder.com/60';">`;
                    }

                    const row = `
                        <tr>
                            <td>${imageCell}</td>
                            <td>${member['Tên hội viên'] || ''}</td>
                            <td>${formatDate(member['Ngày sinh nhật']) || ''}</td>
                            <td>${member['Chức vụ'] || ''}</td>
                            <td>${member['Công ty'] || ''}</td>
                            <td>${member['Chức vụ (Cty)'] || ''}</td>
                            <td>${formatDate(member['Ngày tham gia hội']) || ''}</td>
                            <td>${member['Điện thoại hội viên'] || ''}</td>
                            <td>${member['Email'] || ''}</td>
                            <td>${member['Chi hội'] || ''}</td>
                        </tr>
                    `;

                    tableBody.append(row);
                });
            }

            // Update pagination info
            $('#startCount').text(filteredMembers.length > 0 ? startIndex + 1 : 0);
            $('#endCount').text(endIndex);
            $('#totalCount').text(filteredMembers.length);

            // If selection mode is active, re-add checkboxes
            if (isSelectionMode) {
                // Re-add checkbox column
                $('table thead tr').prepend('<th><input type="checkbox" id="selectAll"></th>');
                $('#memberList tr').each(function () {
                    $(this).prepend('<td><input type="checkbox" class="member-select"></td>');
                });

                // Restore select all functionality
                $('#selectAll').on('change', function () {
                    $('.member-select').prop('checked', $(this).is(':checked'));
                    updateSelectedCount();
                });
            }
        }

        // Function to render pagination
        function renderPagination() {
            const paginationElement = $('#pagination');
            paginationElement.empty();

            const totalPages = Math.ceil(filteredMembers.length / itemsPerPage);

            // Previous button
            paginationElement.append(`
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
            `);

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationElement.append(`<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>`);
                if (startPage > 2) {
                    paginationElement.append(`<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationElement.append(`
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationElement.append(`<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`);
                }
                paginationElement.append(`<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`);
            }

            // Next button
            paginationElement.append(`
                <li class="page-item ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            `);

            // Add click handlers
            $('.page-link').on('click', function (e) {
                e.preventDefault();
                const page = $(this).data('page');
                if (page && page !== currentPage && page >= 1 && page <= totalPages) {
                    currentPage = page;
                    renderTable();
                    renderPagination();
                }
            });
        }

        // Function to filter members
        function applyFilter() {
            const searchTerm = $('#searchInput').val().toLowerCase().trim();

            if (!searchTerm) {
                filteredMembers = [...allMembers];
            } else {
                filteredMembers = allMembers.filter(member => {
                    return (
                        (member['Tên hội viên'] && member['Tên hội viên'].toLowerCase().includes(searchTerm)) ||
                        (member['Công ty'] && member['Công ty'].toLowerCase().includes(searchTerm)) ||
                        (member['Email'] && member['Email'].toLowerCase().includes(searchTerm)) ||
                        (member['Chi hội'] && member['Chi hội'].toLowerCase().includes(searchTerm)) ||
                        (member['Điện thoại hội viên'] && member['Điện thoại hội viên'].toLowerCase().includes(searchTerm))
                    );
                });
            }

            currentPage = 1; // Reset to first page
            renderTable();
            renderPagination();
        }

        // Export to Excel function
        function exportToExcel() {
            // Define the columns to export
            const columns = [
                "Chi hội", "Chức vụ", "Mã", "Tên viết tắt", "Hình hội viên", "Tên hội viên",
                "Giới tính", "Chức vụ (Cty)", "Email", "Điện thoại hội viên", "Ngày sinh nhật",
                "Xã", "Huyện", "Nguyên Quán", "Dân tộc", "Tôn giáo", "Trình độ", "Logo", "Công ty", "MST",
                "Địa chỉ", "Điện thoại cty", "Web Công ty", "Ngày thành lập công ty",
                "Nhóm ngành nghề", "Ngành nghề kinh doanh", "SP/DV_chu_dao",
                "Ngày tham gia hội", "Ngày đóng hội phí", "Giới thiệu công ty", "Người giới thiệu", "Hồ sơ năng lực",
                "Trạng thái hội phí", "Ngày kỷ niệm", "Tuân thủ đều lệ Hội"
            ];

            // Create worksheet
            const ws = XLSX.utils.json_to_sheet(
                filteredMembers.map(member => {
                    const row = {};
                    columns.forEach(col => {
                        if (col.includes('Ngày')) {
                            row[col] = formatDate(member[col] || '');
                        } else {
                            row[col] = member[col] || '';
                        }
                    });
                    return row;
                })
            );

            // Create workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Danh sách hội viên");

            // Generate and save file
            const fileName = `Danh_sach_hoi_vien_${formatDate(new Date())}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // Toggle selection mode
        $('#selectModeBtn').on('click', function () {
            isSelectionMode = true;
            $(this).hide();
            $('#generateCardsBtn, #cancelSelectBtn').show();

            // Add checkbox column to the table
            $('table thead tr').prepend('<th><input type="checkbox" id="selectAll"></th>');
            $('#memberList tr').each(function () {
                $(this).prepend('<td><input type="checkbox" class="member-select"></td>');
            });

            // Select all functionality
            $('#selectAll').on('change', function () {
                $('.member-select').prop('checked', $(this).is(':checked'));
                updateSelectedCount();
            });

            // Update count when individual checkboxes change
            $(document).on('change', '.member-select', updateSelectedCount);
        });

        // Cancel selection mode
        $('#cancelSelectBtn').on('click', function () {
            exitSelectionMode();
        });

        // Exit selection mode function
        function exitSelectionMode() {
            isSelectionMode = false;
            selectedMembers = [];
            $('#selectModeBtn').show();
            $('#generateCardsBtn, #cancelSelectBtn').hide();

            // Remove checkbox column
            $('table th:first-child, table td:first-child').remove();
            updateSelectedCount();
        }

        // Update selected count
        function updateSelectedCount() {
            const count = $('.member-select:checked').length;
            $('#selectedCount').text(count);
        }

        // Generate invitation cards
        $('#generateCardsBtn').on('click', function () {
            selectedMembers = [];
            const startIndex = (currentPage - 1) * itemsPerPage;

            // Get selected members
            $('.member-select:checked').each(function () {
                const index = $(this).closest('tr').index();
                const member = filteredMembers[startIndex + index];
                if (member) {
                    selectedMembers.push(member);
                }
            });

            if (selectedMembers.length === 0) {
                alert('Vui lòng chọn ít nhất một hội viên');
                return;
            }

            generateInvitationCards();
        });

        // Thêm hàm convertImageToDataURL
        function convertImageToDataURL(imageUrl, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";

            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                try {
                    const dataURL = canvas.toDataURL('image/png');
                    callback(dataURL);
                } catch (e) {
                    console.error("Không thể chuyển đổi hình ảnh sang Data URL", e);
                    callback(null);
                }
            };

            img.onerror = function () {
                console.error("Không thể tải hình ảnh:", imageUrl);
                callback(null);
            };

            // Thêm tham số ngẫu nhiên để tránh cache
            img.src = imageUrl + (imageUrl.includes('?') ? '&' : '?') + 'nocache=' + Math.random();
        }

        // Sửa hàm generateInvitationCards
        function generateInvitationCards() {
            const carouselContainer = $('#invitationCarousel');
            carouselContainer.empty();

            // Hiển thị thông báo đang tải
            carouselContainer.html('<div class="text-center p-5"><div class="spinner-border" role="status"></div><p class="mt-2">Đang tải thẻ mời...</p></div>');

            // Kiểm tra ảnh nền đã tải chưa
            if (!backgroundImage.complete) {
                alert("Đang tải ảnh nền. Vui lòng đợi giây lát và thử lại.");
                return;
            }

            let cardsLoaded = 0;
            const totalCards = selectedMembers.length;

            selectedMembers.forEach((member, index) => {
                // Format tên hội viên
                const memberName = (member['Tên hội viên'] || '').split(' ').map(word =>
                    word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
                ).join(' ');

                // Tạo template thẻ mời với hình ở vị trí khung vàng
                const createInvitationCard = (memberImageSrc) => {
                    // CSS cho hình trong khung vàng
                    const imageStyle = memberImageSrc ?
                        `
                position: absolute; 
    top: 40%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    max-width: 220px; 
    max-height: 220px; 
    width: auto;
    height: auto;
    object-fit: contain; 
    border: 2px solid gold; 
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
                ` : '';

                    // Tạo khung vàng để chứa hình (nếu không có hình thì khung vẫn hiển thị)
                    const squareStyle = `
                position: absolute; 
    top: 40%; 
    left: 50%; 
    transform: translate(-50%, -50%); 
    max-width: 220px; 
    max-height: 220px; 
    width: auto;
    height: auto;
    object-fit: contain; 
    border: 2px solid gold; 
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: 10px;
                ${!memberImageSrc ? 'background-color: rgba(255, 255, 255, 0.1);' : ''}
            `;

                    return `
                <div class="carousel-item ${index === 0 ? 'active' : ''}" data-index="${index}">
                    <div class="invitation-card">
                        <img src="${backgroundUrl}" class="invitation-bg" alt="Background" crossorigin="anonymous">
                        <div class="invitation-content">
                            <!-- Khung vàng (hiển thị nếu không có hình) -->
                            ${!memberImageSrc ? `<div style="${squareStyle}"></div>` : ''}
                            
                            <!-- Hình hội viên ở vị trí khung vàng -->
                            ${memberImageSrc ? `<img src="${memberImageSrc}" style="${imageStyle}" alt="${memberName}" />` : ''}
                            
                            <!-- Các thông tin hiện tại - không thay đổi -->
                            <div class="member-info">
                                <div style="font-size: 15px; line-height: 1.7; color: #ffea00; font-weight: bold;">
                                    Hội viên ${memberName}
                                </div>
                                <div style="font-size: 12px; font-weight: bold;">
                                    ${member['Chức vụ (Cty)']} - ${member['Công ty']}
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-2">Thư mời cho ${memberName || 'Hội viên'}</div>
                </div>
            `;
                };

                // Xử lý hình ảnh hội viên nếu có
                if (member['Hình hội viên']) {
                    const baseUrl = 'https://www.appsheet.com/template/gettablefileurl';
                    const params = new URLSearchParams({
                        appName: 'HDNTháiBìnhMiềnNam-925719472',
                        tableName: 'HV_NCC_KH',
                        fileName: member['Hình hội viên'].trim()
                    });
                    const imageUrl = `${baseUrl}?${params.toString()}`;

                    // Chuyển đổi URL thành Data URL để tránh lỗi CORS
                    convertImageToDataURL(imageUrl, function (dataUrl) {
                        if (index === 0) carouselContainer.empty(); // Xóa spinner khi card đầu tiên đã sẵn sàng
                        carouselContainer.append(createInvitationCard(dataUrl));

                        cardsLoaded++;
                        if (cardsLoaded === totalCards) {
                            // Tất cả các thẻ đã được tải xong
                            console.log("Đã tạo tất cả thẻ mời thành công");
                        }
                    });
                } else {
                    if (index === 0) carouselContainer.empty(); // Xóa spinner nếu là card đầu tiên
                    carouselContainer.append(createInvitationCard(null));

                    cardsLoaded++;
                    if (cardsLoaded === totalCards) {
                        // Tất cả các thẻ đã được tải xong
                        console.log("Đã tạo tất cả thẻ mời thành công");
                    }
                }
            });

            invitationModal.show();
        }

        // Cải tiến tải ảnh hiện tại
        $('#downloadCurrentBtn').on('click', async function () {
            try {
                // Hiện trạng thái đang tải
                $('#downloadCurrentText').addClass('d-none');
                $('#downloadCurrentSpinner').removeClass('d-none');
                $('#downloadCurrentBtn').prop('disabled', true);

                const activeSlide = $('.carousel-item.active .invitation-card')[0];
                const memberIndex = $('.carousel-item.active').data('index');
                const memberName = selectedMembers[memberIndex]['Tên hội viên'] || 'invitation';

                // Sử dụng promises để đảm bảo tải ảnh xong trước khi chụp
                await new Promise((resolve) => {
                    const bgImg = activeSlide.querySelector('.invitation-bg');

                    if (bgImg.complete) {
                        resolve();
                    } else {
                        bgImg.onload = resolve;
                        // Trong trường hợp lỗi, vẫn tiếp tục
                        bgImg.onerror = resolve;
                    }
                });

                // Sử dụng html2canvas với các tùy chọn cải tiến
                const canvas = await html2canvas(activeSlide, {
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null,
                    logging: true,
                    scale: 2 // Tăng độ phân giải
                });

                // Chuyển đổi canvas thành blob và tải xuống
                canvas.toBlob(function (blob) {
                    saveAs(blob, `Thu_moi_${memberName.replace(/\s+/g, '_')}.png`);

                    // Khôi phục trạng thái ban đầu
                    $('#downloadCurrentText').removeClass('d-none');
                    $('#downloadCurrentSpinner').addClass('d-none');
                    $('#downloadCurrentBtn').prop('disabled', false);
                }, 'image/png', 1.0);
            } catch (error) {
                console.error("Lỗi khi tải ảnh:", error);
                alert("Có lỗi khi tải ảnh. Vui lòng thử lại.");

                // Khôi phục trạng thái ban đầu
                $('#downloadCurrentText').removeClass('d-none');
                $('#downloadCurrentSpinner').addClass('d-none');
                $('#downloadCurrentBtn').prop('disabled', false);
            }
        });

        // Cải tiến tải tất cả ảnh
        $('#downloadAllBtn').on('click', async function () {
            const zip = new JSZip();
            const totalMembers = selectedMembers.length;

            // Hiển thị trạng thái tải xuống
            $('#downloadAllText').addClass('d-none');
            $('#downloadAllSpinner').removeClass('d-none');
            $('#downloadAllBtn').prop('disabled', true);
            $('#downloadProgress').show();
            $('.progress-bar').css('width', '0%');

            try {
                // Xử lý từng thẻ, sử dụng Promise để có thể chờ đợi
                for (let i = 0; i < totalMembers; i++) {
                    // Cập nhật thanh tiến trình
                    const progress = Math.round((i / totalMembers) * 100);
                    $('.progress-bar').css('width', `${progress}%`);

                    // Đặt thẻ hiện tại để active (để hiển thị chính xác)
                    $('.carousel-item').removeClass('active');
                    $(`.carousel-item[data-index="${i}"]`).addClass('active');

                    // Đợi một chút để đảm bảo DOM được cập nhật
                    await new Promise(resolve => setTimeout(resolve, 100));

                    const memberName = selectedMembers[i]['Tên hội viên'] || `member_${i}`;
                    const card = $(`.carousel-item[data-index="${i}"] .invitation-card`)[0];

                    // Đảm bảo ảnh nền đã được tải xong
                    await new Promise((resolve) => {
                        const bgImg = card.querySelector('.invitation-bg');
                        if (bgImg.complete) {
                            resolve();
                        } else {
                            bgImg.onload = resolve;
                            bgImg.onerror = resolve;
                        }
                    });

                    // Sử dụng html2canvas với cấu hình nâng cao
                    try {
                        const canvas = await html2canvas(card, {
                            useCORS: true,
                            allowTaint: true,
                            backgroundColor: null,
                            scale: 2, // Tăng độ phân giải
                            logging: false
                        });

                        // Chuyển đổi canvas thành blob
                        const blob = await new Promise(resolve => {
                            canvas.toBlob(resolve, 'image/png', 1.0);
                        });

                        // Thêm vào tệp zip
                        zip.file(`Thu_moi_${memberName.replace(/\s+/g, '_')}.png`, blob);
                    } catch (err) {
                        console.error(`Error processing card ${i}:`, err);
                        // Tiếp tục xử lý các thẻ tiếp theo ngay cả khi có lỗi
                    }
                }

                // Tạo file zip và tải xuống
                const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' });
                saveAs(zipBlob, 'Thu_moi_dai_hoi.zip');

                // Khôi phục trạng thái ban đầu
                $('#downloadAllText').removeClass('d-none');
                $('#downloadAllSpinner').addClass('d-none');
                $('#downloadAllBtn').prop('disabled', false);
                $('#downloadProgress').hide();

            } catch (error) {
                console.error("Lỗi khi tạo file ZIP:", error);
                alert("Có lỗi khi tạo file ZIP. Vui lòng thử lại.");

                // Khôi phục trạng thái ban đầu
                $('#downloadAllText').removeClass('d-none');
                $('#downloadAllSpinner').addClass('d-none');
                $('#downloadAllBtn').prop('disabled', false);
                $('#downloadProgress').hide();
            }
        });

        // Tạo canvas tạm thời để kiểm tra khả năng sử dụng Canvas
        function checkCanvasSupport() {
            try {
                const canvas = document.createElement('canvas');
                return !!(canvas.getContext && canvas.getContext('2d'));
            } catch (e) {
                return false;
            }
        }

        // Search on Enter key press
        $('#searchInput').on('keyup', function (event) {
            if (event.key === 'Enter') {
                applyFilter();
            }
        });

        // Add this to your JavaScript
        $('#itemsPerPageSelector').on('change', function () {
            const selectedValue = $(this).val();
            if (selectedValue === 'all') {
                itemsPerPage = filteredMembers.length; // Show all members
            } else {
                itemsPerPage = parseInt(selectedValue);
            }

            currentPage = 1; // Reset to first page when changing display count
            renderTable();
            renderPagination();
        });

        // Initialize on page load
        $(document).ready(function () {
            // Kiểm tra hỗ trợ Canvas
            if (!checkCanvasSupport()) {
                alert("Trình duyệt của bạn không hỗ trợ Canvas, chức năng tạo thư mời có thể không hoạt động. Vui lòng sử dụng trình duyệt hiện đại hơn.");
            }

            // Tạo biến toàn cục cho kết nối CORS
            window.DOMURL = window.URL || window.webkitURL || window;

            fetchMembers();
        });
    </script>
</body>
