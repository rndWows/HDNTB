<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Hội Viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .container {
            max-width: 100%;
            margin: auto;
        }

        .member-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }

        .pagination {
            margin-top: 20px;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .excel-btn {
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm...">
                    <button class="btn btn-primary" onclick="applyFilter()">Tìm kiếm</button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-success excel-btn" onclick="exportToExcel()">
                    <i class="bi bi-download"></i> Xuất Excel
                </button>
            </div>
        </div>

        <div id="loading" class="text-center my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Đang tải...</span>
            </div>
            <p class="mt-2">Đang tải dữ liệu...</p>
        </div>

        <div id="error" class="alert alert-danger my-4" style="display: none;"></div>

        <div id="tableContainer" style="display: none;">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                        <tr>
                            <th>Hình</th>
                            <th>Tên hội viên</th>
                            <th>Ngày sinh nhật</th>
                            <th>Chức vụ</th>
                            <th>Công ty</th>
                            <th>Chức vụ (Cty)</th>
                            <th>Ngày tham gia hội</th>
                            <th>Điện thoại hội viên</th>
                            <th>Email</th>
                            <th>Chi hội</th>
                        </tr>
                    </thead>
                    <tbody id="memberList"></tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    Hiển thị <span id="startCount">0</span> đến <span id="endCount">0</span> của <span
                        id="totalCount">0</span> hội viên
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <script>
        // Constants for AppSheet connection
        const appId = '4dc0f883-9c1c-4d4a-81aa-4bd7971b78dd';
        const accessKey = 'V2-W3bVS-xCeBf-DSk9A-U3pVV-B5C41-0gBhu-Z1bQL-j6kNl';
        const region = 'www';

        // Store all members and pagination state
        let allMembers = [];
        let filteredMembers = [];
        let currentPage = 1;
        const itemsPerPage = 10;

        // Function to format date (DD/MM/YYYY)
        function formatDate(dateString) {
            if (!dateString) return '';
            try {
                const date = new Date(dateString);
                if (isNaN(date)) return '';
                return date.toLocaleDateString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            } catch (e) {
                return '';
            }
        }

        // Function to fetch data from AppSheet
        async function fetchMembers() {
            try {
                $('#loading').show();
                $('#tableContainer').hide();
                $('#error').hide();

                const response = await $.ajax({
                    url: `https://${region}.appsheet.com/api/v2/apps/${appId}/tables/HV_NCC_KH/Action`,
                    method: 'POST',
                    headers: {
                        'ApplicationAccessKey': accessKey,
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({
                        Action: 'Find',
                        Properties: {},
                        Selector: "HV_NCC_KH"  // Lấy tất cả dữ liệu
                    })
                });

                if (!Array.isArray(response)) {
                    throw new Error('Invalid data format received');
                }

                // Filter ở client
                allMembers = response.filter(member => {
                    // Kiểm tra nhiều khả năng của giá trị Active
                    return member.Active === 'active' ||
                        member.Active === true ||
                        member.Active === 'true' ||
                        member.Active === 'Active';
                });

                filteredMembers = [...allMembers];

                renderTable();
                renderPagination();

                $('#loading').hide();
                $('#tableContainer').show();
            } catch (error) {
                console.error('Failed to fetch members:', error);
                $('#loading').hide();
                $('#error').show().text(`Lỗi khi tải dữ liệu: ${error.message}`);
            }
        }

        // Function to render table with current page data
        function renderTable() {
            const tableBody = $('#memberList');
            tableBody.empty();

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, filteredMembers.length);

            const membersToShow = filteredMembers.slice(startIndex, endIndex);

            if (membersToShow.length === 0) {
                tableBody.html(`
                    <tr>
                        <td colspan="10" class="text-center py-5">
                            Không tìm thấy hội viên nào phù hợp với tìm kiếm của bạn
                        </td>
                    </tr>
                `);
            } else {
                membersToShow.forEach((member, index) => {
                    // Simplified image handling - just show a placeholder if no image
                    let imageCell = `<div class="bg-light text-center rounded" style="width: 60px; height: 60px; line-height: 60px;">N/A</div>`;

                    if (member['Hình hội viên']) {
                        const baseUrl = 'https://www.appsheet.com/template/gettablefileurl';
                        const params = new URLSearchParams({
                            appName: 'HDNTháiBìnhMiềnNam-925719472',
                            tableName: 'HV_NCC_KH',
                            fileName: member['Hình hội viên'].trim()
                        });
                        const imageUrl = `${baseUrl}?${params.toString()}`;
                        imageCell = `<img src="${imageUrl}" class="member-avatar" alt="${member['Tên hội viên'] || 'Hội viên'}" onerror="this.src='https://via.placeholder.com/60';">`;
                    }

                    const row = `
                        <tr>
                            <td>${imageCell}</td>
                            <td>${member['Tên hội viên'] || ''}</td>
                            <td>${formatDate(member['Ngày sinh nhật']) || ''}</td>
                            <td>${member['Chức vụ'] || ''}</td>
                            <td>${member['Công ty'] || ''}</td>
                            <td>${member['Chức vụ (Cty)'] || ''}</td>
                            <td>${formatDate(member['Ngày tham gia hội']) || ''}</td>
                            <td>${member['Điện thoại hội viên'] || ''}</td>
                            <td>${member['Email'] || ''}</td>
                            <td>${member['Chi hội'] || ''}</td>
                        </tr>
                    `;

                    tableBody.append(row);
                });
            }

            // Update pagination info
            $('#startCount').text(filteredMembers.length > 0 ? startIndex + 1 : 0);
            $('#endCount').text(endIndex);
            $('#totalCount').text(filteredMembers.length);
        }

        // Function to render pagination
        function renderPagination() {
            const paginationElement = $('#pagination');
            paginationElement.empty();

            const totalPages = Math.ceil(filteredMembers.length / itemsPerPage);

            // Previous button
            paginationElement.append(`
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
            `);

            // Page numbers
            const maxVisiblePages = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
            let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

            if (endPage - startPage + 1 < maxVisiblePages) {
                startPage = Math.max(1, endPage - maxVisiblePages + 1);
            }

            if (startPage > 1) {
                paginationElement.append(`<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>`);
                if (startPage > 2) {
                    paginationElement.append(`<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationElement.append(`
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    paginationElement.append(`<li class="page-item disabled"><a class="page-link" href="#">...</a></li>`);
                }
                paginationElement.append(`<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`);
            }

            // Next button
            paginationElement.append(`
                <li class="page-item ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
            `);

            // Add click handlers
            $('.page-link').on('click', function (e) {
                e.preventDefault();
                const page = $(this).data('page');
                if (page && page !== currentPage && page >= 1 && page <= totalPages) {
                    currentPage = page;
                    renderTable();
                    renderPagination();
                }
            });
        }

        // Function to filter members
        function applyFilter() {
            const searchTerm = $('#searchInput').val().toLowerCase().trim();

            if (!searchTerm) {
                filteredMembers = [...allMembers];
            } else {
                filteredMembers = allMembers.filter(member => {
                    return (
                        (member['Tên hội viên'] && member['Tên hội viên'].toLowerCase().includes(searchTerm)) ||
                        (member['Công ty'] && member['Công ty'].toLowerCase().includes(searchTerm)) ||
                        (member['Email'] && member['Email'].toLowerCase().includes(searchTerm)) ||
                        (member['Chi hội'] && member['Chi hội'].toLowerCase().includes(searchTerm)) ||
                        (member['Điện thoại hội viên'] && member['Điện thoại hội viên'].toLowerCase().includes(searchTerm))
                    );
                });
            }

            currentPage = 1; // Reset to first page
            renderTable();
            renderPagination();
        }

        // Export to Excel function
        function exportToExcel() {
            // Define the columns to export
            const columns = [
                "Chi hội", "Chức vụ", "Mã", "Tên viết tắt", "Hình hội viên", "Tên hội viên",
                "Giới tính", "Chức vụ (Cty)", "Email", "Điện thoại hội viên", "Ngày sinh nhật",
                "Xã", "Huyện", "Nguyên Quán", "Dân tộc", "Tôn giáo", "Trình độ", "Logo", "Công ty", "MST",
                "Địa chỉ", "Điện thoại cty", "Web Công ty", "Ngày thành lập công ty",
                "Nhóm ngành nghề", "Ngành nghề kinh doanh", "SP/DV_chu_dao",
                "Ngày tham gia hội", "Ngày đóng hội phí", "Giới thiệu công ty", "Người giới thiệu", "Hồ sơ năng lực",
                 "Trạng thái hội phí", "Ngày kỷ niệm", "Tuân thủ đều lệ Hội"
            ];

            // Create worksheet
            const ws = XLSX.utils.json_to_sheet(
                filteredMembers.map(member => {
                    const row = {};
                    columns.forEach(col => {
                        if (col.includes('Ngày')) {
                            row[col] = formatDate(member[col] || '');
                        } else {
                            row[col] = member[col] || '';
                        }
                    });
                    return row;
                })
            );

            // Create workbook
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Danh sách hội viên");

            // Generate and save file
            const fileName = `Danh_sach_hoi_vien_${formatDate(new Date())}.xlsx`;
            XLSX.writeFile(wb, fileName);
        }

        // Search on Enter key press
        $('#searchInput').on('keyup', function (event) {
            if (event.key === 'Enter') {
                applyFilter();
            }
        });

        // Initialize on page load
        $(document).ready(function () {
            fetchMembers();
        });
    </script>
</body>

</html>
